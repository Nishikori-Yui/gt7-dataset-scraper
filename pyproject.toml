[project]
name = "gt7-dataset-scraper"
version = "0.1.0"
description = "Scrape the official Gran Turismo 7 car catalog into SQLite."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "tqdm>=4.66.1",
    "json5>=0.9.14",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[tool.uv]
package = false
